name: Build Layalina APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Layalina.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Layalina-APK
          path: Layalina.apk

      - name: Publish direct download link (Release "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ليالينا - آخر نسخة
          body: "حمّل Layalina.apk وثبّته على Android TV."
          files: Layalina.apk
